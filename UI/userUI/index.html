<!DOCTYPE html>
<html lang="ko" class="dark">

<head>
  <meta charset="UTF-8" />
  <!-- maximum-scale=1.0, user-scalable=no는 사용자가 핀치 줌을 하지 못하게 하는 설정입니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WalkMate</title>

  <!-- iOS 모바일 웹앱 최적화 -->
  <!-- 홈 화면 추가 시 브라우저 주소창과 하단 툴바가 제거되어 네이티브 앱처럼 전체 화면(Standalone)으로 켜지게 만듭니다. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- 전체 화면 구동 시, 스마트폰 상단 상태바(시간, 배터리) 영역 뒤로 앱의 어두운 배경이 스며들어 예쁘게 겹치도록 반투명 스타일을 줍니다. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>

<body>
  <!-- ReactDOM.createRoot가 이 div를 찾아 App 컴포넌트를 넣습니다. id가 바뀌면 index.tsx도 같이 바꿔야 합니다. -->
  <div id="root"></div>
  <!-- type="module"은 ES 모듈 import 문법을 쓰겠다는 뜻이고, Vite가 /index.tsx를 변환해 실행합니다. -->
  <script type="module" src="/index.tsx"></script>
</body>

</html>
