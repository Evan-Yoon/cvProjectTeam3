<!DOCTYPE html>
<!--
  index.html은 Vite가 가장 먼저 브라우저에 전달하는 HTML 껍데기입니다.
  실제 React 화면은 아래 body의 <div id="root"></div> 안에 index.tsx가 렌더링합니다.
-->
<html lang="ko" class="dark">

<head>
  <!-- UTF-8은 한글, 이모지, 특수문자가 깨지지 않도록 하는 문자 인코딩 설정입니다. -->
  <meta charset="UTF-8" />
  <!--
    viewport는 모바일 화면 배율을 제어합니다.
    maximum-scale=1.0, user-scalable=no는 사용자가 핀치 줌을 하지 못하게 하므로
    접근성 측면에서는 장단점이 있습니다. 이 앱은 전체 화면 음성/터치 UX를 우선한 설정입니다.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WalkMate</title>

  <!-- tflite_web_api_client.js는 VisionCamera 마운트 시 동적 로드 (STT 블로킹 방지) -->

  <!-- Tailwind CDN: 빌드된 CSS 파일 없이 className 문자열만으로 유틸리티 CSS를 사용할 수 있게 합니다. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: fontFamily.display에서 Inter를 사용할 수 있게 불러옵니다. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <!-- Material Icons: <span class="material-icons-round">mic</span> 같은 아이콘 텍스트를 실제 아이콘으로 보여줍니다. -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />

  <script>
    // tailwind.config는 CDN 방식 Tailwind가 읽는 런타임 설정입니다.
    // darkMode: 'class'라서 html 태그의 class="dark"가 붙어 있을 때 dark: 계열 스타일이 활성화됩니다.
    // 현재 파일의 <html lang="ko" class="dark">가 바로 그 스위치 역할을 합니다.
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // primary는 앱 전체에서 쓰는 노란색 브랜드 컬러입니다. 예: className="text-primary"
            primary: '#FDBD10',
            'primary-dim': '#CFA00D',
            'surface-dark': '#1a1a1a',
            background: '#000000',
          },
          fontFamily: {
            // font-display라는 Tailwind 클래스가 Inter 폰트 패밀리로 연결됩니다.
            display: ['Inter', 'sans-serif'],
          },
          animation: {
            // animate-pulse-slow, animate-wave 같은 커스텀 애니메이션 이름을 추가합니다.
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'wave': 'wave 1.2s ease-in-out infinite',
          },
          keyframes: {
            // 음성 인식 파형 막대가 위아래로 움직이는 높이 애니메이션입니다.
            wave: {
              '0%, 100%': { height: '20%' },
              '50%': { height: '100%' },
            }
          }
        },
      },
    }
  </script>
  <style>
    /*
      이 style 블록은 전역 CSS입니다.
      React 컴포넌트의 className보다 먼저 브라우저 기본 동작을 제어하는 용도로 쓰입니다.
    */
    body {
      background-color: #000000;
      /* 모바일에서 화면 끝을 당겼을 때 페이지 바깥으로 튕기는 스크롤 효과를 막습니다. */
      overscroll-behavior: none;
      /* iOS/모바일 브라우저에서 터치 시 생기는 회색 하이라이트를 제거합니다. */
      -webkit-tap-highlight-color: transparent;
    }

    /* wave-bar의 nth-child별 delay는 같은 애니메이션을 살짝 어긋나게 실행해 파형처럼 보이게 합니다. */
    .wave-bar:nth-child(1) {
      animation-delay: 0.1s;
    }

    .wave-bar:nth-child(2) {
      animation-delay: 0.2s;
    }

    .wave-bar:nth-child(3) {
      animation-delay: 0.3s;
    }

    .wave-bar:nth-child(4) {
      animation-delay: 0.15s;
    }

    .wave-bar:nth-child(5) {
      animation-delay: 0.4s;
    }
  </style>


</head>

<body>
  <!-- ReactDOM.createRoot가 이 div를 찾아 App 컴포넌트를 넣습니다. id가 바뀌면 index.tsx도 같이 바꿔야 합니다. -->
  <div id="root"></div>
  <!-- type="module"은 ES 모듈 import 문법을 쓰겠다는 뜻이고, Vite가 /index.tsx를 변환해 실행합니다. -->
  <script type="module" src="/index.tsx"></script>
</body>

</html>
