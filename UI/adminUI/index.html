<!DOCTYPE html>
<!-- adminUI의 HTML 진입점입니다. 실제 화면은 index.tsx가 #root에 React 컴포넌트를 렌더링합니다. -->
<html lang="ko">
  <head>
    <!-- 한글이 깨지지 않도록 UTF-8 인코딩을 사용합니다. -->
    <meta charset="UTF-8" />
    <!-- 모바일/데스크톱 브라우저에서 CSS 픽셀과 화면 폭을 맞춥니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WalkMate Admin System</title>
    <!-- Tailwind CDN입니다. index.css의 Tailwind import와 함께 개발 흔적이 공존합니다. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 관리자 UI는 Noto Sans KR을 기본 글꼴로 사용합니다. -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Noto Sans KR', sans-serif;
      }
    </style>
  <!-- importmap은 브라우저가 react/lucide/recharts 같은 bare import를 CDN으로 찾게 하는 설정입니다. -->
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<!-- Vite가 처리하는 전역 CSS 진입점입니다. -->
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 text-slate-900">
    <!-- ReactDOM.createRoot가 이 div를 찾아 App 컴포넌트를 넣습니다. -->
    <div id="root"></div>
  <!-- Vite가 /index.tsx를 변환해 ES module로 실행합니다. -->
  <script type="module" src="/index.tsx"></script>
</body>
</html>
